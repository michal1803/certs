<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.examtopics.com https://img.examtopics.com https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self' https://exam-hub-push.michaw49.workers.dev; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f7">
<script src="assets/theme.js"></script>
<meta name="description" content="Symulacje egzaminów certyfikacyjnych (AZ-104, Terraform Associate) i nauka z pytań. Ten sam czas i te same proporcje domen co na prawdziwym egzaminie.">
<title>Exam Hub</title>
<link rel="preload" href="assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exam Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body class="launcher">
<div class="shell">
  <header class="top">
    <div class="exam-switch" id="exam-switch" role="group" aria-label="Egzamin"></div>
    <button class="pill gear" type="button" id="open-settings" aria-haspopup="dialog" aria-label="Ustawienia i konto"></button>
  </header>

  <main id="view" tabindex="-1">
    <noscript><p class="note">Exam Hub potrzebuje włączonego JavaScriptu.</p></noscript>
  </main>

  <nav class="tabbar" aria-label="Sekcje">
    <a href="#nauka" data-tab="nauka"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg><span>Nauka</span></a>
    <a href="#egzamin" data-tab="egzamin"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9 2h6"/></svg><span>Egzamin</span></a>
    <a href="#postep" data-tab="postep"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Postęp</span></a>
  </nav>
</div>

<dialog class="xf-sheet settings" id="settings" aria-labelledby="settings-h">
  <div class="xf-sheet-in">
    <div class="xf-sheet-head"><h2 id="settings-h" tabindex="-1" autofocus>Ustawienia</h2><button class="btn btn-quiet icon-btn" type="button" data-close aria-label="Zamknij"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>

    <section class="set" id="konto" aria-labelledby="konto-h">
      <h3 id="konto-h">Konto</h3>
      <div class="account" id="account"><p class="small muted">Postęp, gwiazdki i wyniki zapisują się w tej przeglądarce.</p></div>
    </section>

    <section class="set remind" id="remind" aria-labelledby="remind-h">
      <h3 id="remind-h">Codzienne przypomnienie</h3>
      <p class="small muted">Otwiera szybką piątkę z pytań, które czekają na powtórkę.</p>
      <div class="remind-actions">
        <label class="vh" for="remind-time">Godzina przypomnienia</label><input class="select remind-time" type="time" id="remind-time" value="19:00" required>
        <div data-push hidden></div>
        <button class="btn" type="button" data-ics>Dodaj do kalendarza</button>
      </div>
      <p class="small muted" data-remind-status role="status"></p>
    </section>

    <section class="set" aria-labelledby="look-h">
      <h3 id="look-h">Wygląd</h3>
      <div class="seg" role="group" aria-label="Motyw" data-theme-pick>
        <button type="button" data-theme-choice="system">Systemowy</button>
        <button type="button" data-theme-choice="light">Jasny</button>
        <button type="button" data-theme-choice="dark">Ciemny</button>
      </div>
      <div data-shortcuts-slot></div>
    </section>

    <section class="set about" aria-labelledby="about-h">
      <h3 id="about-h" class="vh">O aplikacji</h3>
      <p class="small muted">Nieoficjalne narzędzie do nauki, niezwiązane z Microsoft ani HashiCorp. <a href="privacy.html">Polityka prywatności</a></p>
    </section>
  </div>
</dialog>

<script src="assets/exam-data.js"></script>
<script src="assets/push-config.js"></script>
<script src="assets/sync.js"></script>
<script src="assets/launcher.js"></script>
<script src="assets/remind.js"></script>
</body>
</html>
