# Cloudflare Worker that sends the daily Exam Hub study reminder (Web Push).
name = "exam-hub-push"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Served at https://exam-hub-push.<subdomain>.workers.dev; no preview URLs needed.
workers_dev = true
preview_urls = false

# Every 15 minutes; each subscriber gets the push in the slot matching their local time.
[triggers]
crons = ["*/15 * * * *"]

# `npx wrangler kv namespace create SUBS` prints the real id; paste it here.
[[kv_namespaces]]
binding = "SUBS"
id = "c7707e2f99854759ac38f2e24dd04f70"

[vars]
# Public half of the VAPID key pair from `node scripts/gen-vapid.mjs`.
# The private half is a secret: `npx wrangler secret put VAPID_PRIVATE_KEY`.
VAPID_PUBLIC_KEY = "BBu3wf6Qcsa417hDEVniXWkLv3duN0hE8y7458FK_rA5SfM_YQTsAPzw0y6RbUxuTs5notAYnku4iSy9Cr_uhBA"
VAPID_SUBJECT = "https://michal1803.github.io/certs/"
# GitHub OAuth App client id (public). The client secret and SESSION_SECRET are secrets:
# `npx wrangler secret put GITHUB_CLIENT_SECRET`, `npx wrangler secret put SESSION_SECRET`.
GITHUB_CLIENT_ID = "Ov23lieJOmRhQHuCB0Nr"

# Login sessions and synced progress. `npx wrangler d1 create exam-hub` prints the id.
[[d1_databases]]
binding = "DB"
database_name = "exam-hub"
database_id = "8156a635-0678-462b-8e8a-555030e06886"
migrations_dir = "migrations"

# Workers Rate Limiting (needs wrangler >= 4.36). namespace_id is any integer we pick,
# unique within the Cloudflare account; period must be 10 or 60 (seconds) and must match
# RATE_PERIOD_S in src/http.js. Counters are per Cloudflare location and approximate.
# Per IP: /auth/login and /auth/exchange.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "47101"
simple = { limit = 10, period = 60 }

# Per IP: /subscribe, /unsubscribe, /test.
[[ratelimits]]
name = "RL_PUSH"
namespace_id = "47102"
simple = { limit = 10, period = 60 }

# Per IP and per signed-in user: /me, /sync, /auth/logout*, DELETE /account.
[[ratelimits]]
name = "RL_API"
namespace_id = "47103"
simple = { limit = 60, period = 60 }
